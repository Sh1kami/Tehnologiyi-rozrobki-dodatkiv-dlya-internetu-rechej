name: Check documentation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @redocly/cli@1.34.6 lint --config docs/redocly.yaml docs/openapi.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: course-report
          path: |
            СР 09/Звіт.pdf
            СР 09/Підсумковий звіт.docx
            СР 09/Презентація Fleet Watch.pptx
