name: fleetiot
services:
  broker:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: [CMD, mosquitto_pub, -h, localhost, -t, health/check, -m, ok]
      interval: 5s
      timeout: 3s
      retries: 8
  backend:
    build: .
    image: fleet-watch:local
    environment:
      MQTT_URL: mqtt://broker:1883
      FLEET_URL: http://127.0.0.1:3080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FLEET_PASSWORD: ${FLEET_PASSWORD:?Set FLEET_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:8080}
      WS_PATH: ${WS_PATH:-/socket.io}
    volumes:
      - fleet-data:/data
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 8
  geofence:
    image: fleet-watch:local
    command: ["node", "--input-type=module", "-e", "import {startGeofence} from './src/geofence.js';startGeofence(process.env.MQTT_URL)"]
    environment:
      MQTT_URL: mqtt://broker:1883
    depends_on:
      backend:
        condition: service_healthy
  proxy:
    image: nginx:1.28-alpine
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${FLEET_PORT:-8080}:8080"
volumes:
  fleet-data:
  mqtt-data:
