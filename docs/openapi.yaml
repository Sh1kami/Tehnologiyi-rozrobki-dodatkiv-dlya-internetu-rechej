              }
            }
          },
          "403": {
            "description": "ТЗ поза правами користувача",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "ТЗ не знайдено",
