      }
    },
    "/geofences/{id}": {
      "put": {
        "operationId": "setGeofencePolygon",
        "description": "Диспетчер вводить один зовнішній замкнений контур GeoJSON у порядку [lon, lat].",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Успішний результат",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GeofencePolygon"
                }
              }
            }
          },
          "400": {
            "description": "Некоректні параметри",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Потрібен токен",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "ТЗ поза правами користувача",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "ТЗ не знайдено",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "type",
                  "coordinates"
                ],
                "properties": {
                  "type": {
                    "type": "string",
                    "enum": [
                      "Polygon"
                    ]
                  },
                  "coordinates": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 1,
                    "items": {
                      "type": "array",
                      "minItems": 4,
                      "maxItems": 100,
                      "items": {
                        "type": "array",
                        "minItems": 2,
                        "maxItems": 2,
                        "items": {
                          "type": "number"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/reports/gps-summary": {
      "get": {
        "operationId": "gpsSummary",
        "description": "Зведення для диспетчера: координати до трьох знаків, лише комірки з двома ТЗ або більше, підозрілі точки пропускаються.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "from",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Успішний результат",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "precision": {
                      "type": "integer",
                      "example": 3
                    },
                    "cells": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "lat": {
                            "type": "number"
                          },
                          "lon": {
                            "type": "number"
                          },
                          "observations": {
                            "type": "integer"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Некоректні параметри",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Потрібен токен",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "ТЗ поза правами користувача",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "operationId": "fleetMetrics",
        "description": "Поточні лічильники стенда і gauge активних диспетчерських Socket.IO з’єднань.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [],
        "responses": {
          "200": {
            "description": "Успішний результат",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "received": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "stored": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "rejected": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "duplicate": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "geofence": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "connections": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "dispatchers": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "fleet_ws_dispatcher_clients": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "sse": {
                      "type": "integer",
                      "minimum": 0
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Потрібен токен",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "ТЗ поза правами користувача",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Point": {
        "type": "object",
        "required": [
          "ts",
          "value"
        ],
        "properties": {
          "ts": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "value": {
            "type": "number"
          },
          "count": {
            "type": "integer",
            "minimum": 1
          },
          "device": {
            "type": "string",
            "description": "Ідентифікатор ТЗ у відповіді зі сторінкуванням."
          }
        }
      },
      "ErrorResponse": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "Vehicle": {
        "type": "object",
        "required": [
          "id",
          "name",
          "region",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "region": {
            "type": "string",
            "enum": [
              "west",
              "east"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "normal",
              "warning",
              "critical",
              "speed",
              "outside",
              "offline"
            ]
          },
          "geofence": {
            "nullable": true,
            "type": "object",
            "description": "Власне коло або полігон ТЗ. Null означає типову геозону."
          }
        }
      },
      "Settings": {
        "type": "object",
        "required": [
          "speedLimit",
          "fuelMinPercent"
        ],
        "properties": {
          "speedLimit": {
            "type": "integer",
            "minimum": 30,
            "maximum": 130,
            "multipleOf": 5
          },
          "fuelMinPercent": {
            "type": "integer",
            "minimum": 5,
            "maximum": 30
          },
          "version": {
            "type": "integer",
            "readOnly": true
          }
        }
      },
      "TrackPoint": {
        "type": "object",
        "required": [
          "ts",
          "lat",
          "lon",
          "speed"
        ],
        "properties": {
          "ts": {
            "type": "integer"
          },
          "lat": {
            "type": "number",
            "minimum": -90,
            "maximum": 90
          },
          "lon": {
            "type": "number",
            "minimum": -180,
            "maximum": 180
          },
          "speed": {
            "type": "number",
            "nullable": true
          }
        }
      },
      "GeofenceCircle": {
        "type": "object",
        "required": [
          "lat",
          "lon",
          "radiusM"
        ],
        "properties": {
          "lat": {
            "type": "number",
            "minimum": -90,
            "maximum": 90
          },
          "lon": {
            "type": "number",
            "minimum": -180,
            "maximum": 180
          },
          "radiusM": {
            "type": "integer",
            "minimum": 100,
            "maximum": 5000
          }
        }
      },
      "GeofencePolygon": {
        "type": "object",
        "required": [
          "polygon"
        ],
        "properties": {
          "polygon": {
            "type": "array",
            "items": {
              "type": "array",
              "minItems": 2,
              "maxItems": 2,
              "items": {
                "type": "number"
              }
            }
          }
        }
      }
    },
    "parameters": {
      "Device": {
        "name": "device",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string"
        },
        "example": "truck-07"
      },
      "From": {
        "name": "from",
        "in": "query",
        "schema": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        }
      },
      "To": {
        "name": "to",
        "in": "query",
        "schema": {
          "type": "integer",
          "format": "int64",
          "minimum": 0
        }
      },
      "Metric": {
        "name": "metric",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string",
          "enum": [
            "speed",
            "fuel",
            "lat",
            "lon",
            "engine"
          ]
        }
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    }
  }
}
